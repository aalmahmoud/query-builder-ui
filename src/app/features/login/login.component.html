<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-icon class="login-icon">query_stats</mat-icon>
      <mat-card-title>QueryDSL Admin</mat-card-title>
      <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      @if (error()) {
        <div class="error-banner">{{ error() }}</div>
      }
      <form (ngSubmit)="login()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="username" name="username"
            placeholder="admin&#64;system.com" autocomplete="username" required>
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [(ngModel)]="password" name="password"
            [type]="hidePassword ? 'password' : 'text'"
            autocomplete="current-password" required>
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button"
            (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-flat-button color="primary" class="full-width login-btn"
          type="submit" [disabled]="loading() || !username || !password">
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Sign In
          }
        </button>
      </form>
    </mat-card-content>
    <mat-card-footer>
      <div class="seed-info">
        Demo: admin&#64;system.com / admin123
      </div>
    </mat-card-footer>
  </mat-card>
</div>
