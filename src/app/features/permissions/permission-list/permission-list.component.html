<div class="page-header">
  <div>
    <h1>Permissions</h1>
    <p class="count">{{ totalElements() }} total</p>
  </div>
  <div class="header-actions">
    <button mat-stroked-button (click)="openExport()">
      <mat-icon>download</mat-icon> Export
    </button>
    <a mat-flat-button color="primary" routerLink="/permissions/new">
      <mat-icon>add</mat-icon> Add Permission
    </a>
  </div>
</div>

<app-query-builder [fields]="fields" (search)="onSearch($event)" (reset)="onReset()"></app-query-builder>

@if (loading()) { <mat-progress-bar mode="indeterminate"></mat-progress-bar> }

<div class="table-container mat-elevation-z1">
  <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSort($event)" matSortActive="resource" matSortDirection="asc">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let row"><code>{{ row.name }}</code></td>
    </ng-container>

    <ng-container matColumnDef="resource">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Resource</th>
      <td mat-cell *matCellDef="let row"><span class="resource-chip">{{ row.resource }}</span></td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Action</th>
      <td mat-cell *matCellDef="let row">{{ row.action }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let row">{{ row.description }}</td>
    </ng-container>

    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let row">
        <span class="status-chip" [class.active]="row.isActive" [class.inactive]="!row.isActive">
          {{ row.isActive ? 'Active' : 'Inactive' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button [matMenuTriggerFor]="menu"><mat-icon>more_vert</mat-icon></button>
        <mat-menu #menu="matMenu">
          <a mat-menu-item [routerLink]="['/permissions', row.id, 'edit']"><mat-icon>edit</mat-icon> Edit</a>
          <button mat-menu-item (click)="deletePermission(row)"><mat-icon color="warn">delete</mat-icon> Delete</button>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr class="no-data" *matNoDataRow><td [attr.colspan]="displayedColumns.length">No permissions found</td></tr>
  </table>
  <mat-paginator [length]="totalElements()" [pageSize]="pageSize" [pageIndex]="pageIndex"
    [pageSizeOptions]="[5, 10, 25, 50]" (page)="onPage($event)" showFirstLastButtons></mat-paginator>
</div>
